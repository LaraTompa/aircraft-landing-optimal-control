# Bulirsch–Montrone–Pesch minimax abort-landing experiment with paper windshear.
name: baseline_pointmass_paper_minimax

aircraft: ../aircraft/airbus_point_mass.yaml
wind: ../wind/paper_windshear.yaml
problem: ../problems/abort_landing_minimax.yaml

dynamics:
  model: point_mass
  wind_aware: true

transcription:
  method: multiple_shooting
  integrator: RK4

solver:
  name: ipopt
  options:
    expand: true
    max_iter: 3000
    tol: 1.0e-7
    print_level: 5

experiment:
  type: minimax_optimal_control
  objectives:
    - minimax_clearance
  warm_start: false

visualization:
  plots: false
  wind_field: false
  animation: false
  animation_settings:
    solution: minimax_clearance
    playback_speed: 5.0
    interval: 30
